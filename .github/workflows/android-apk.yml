name: Android APK
# Builds a sideload APK (no Google Play). Download it from the run's "Artifacts" section.
on:
  workflow_dispatch:
    inputs:
      next:
        description: "Build iTeam Next (relay server, Google sign-in, separate app)? yes/no"
        default: "no"
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write   # first run stores the encrypted signing key in android/signing/

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Signing key
        # One key forever, so updates install over the old app. It is generated here on the first run,
        # encrypted with your ANDROID_KEYSTORE_PASSWORD secret, and committed — the password never leaves GitHub Secrets.
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$PW" ]; then echo "::warning::No ANDROID_KEYSTORE_PASSWORD secret: debug-signed APK (updates need an uninstall)."; exit 0; fi
          KS="$RUNNER_TEMP/iteam.jks"
          if [ -f android/signing/iteam.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:PW -in android/signing/iteam.jks.enc -out "$KS"
          else
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias iteam -keyalg RSA -keysize 4096 -validity 10000 \
              -storepass "$PW" -keypass "$PW" -dname "CN=Devendra Jondhale, O=iTeam, C=IN" >/dev/null
            mkdir -p android/signing
            openssl enc -aes-256-cbc -pbkdf2 -iter 300000 -salt -pass env:PW -in "$KS" -out android/signing/iteam.jks.enc
            git config user.name "iTeam CI"; git config user.email "ci@users.noreply.github.com"
            git add android/signing/iteam.jks.enc
            git commit -qm "Android signing key (encrypted) [skip ci]" && git pull -q --rebase && git push -q
            echo "::notice title=signing::New signing key created and stored encrypted"
          fi
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"
      - name: Build APK
        env:
          CK_API_TOKEN: ${{ secrets.CK_API_TOKEN }}
          CK_ENV: ${{ vars.CK_ENV || 'production' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ITEAM_RELAY: ${{ github.event.inputs.next == 'yes' && '1' || '' }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
        run: |
          if [ "$ITEAM_RELAY" = 1 ]; then

            if [ -n "${KEYSTORE_FILE:-}" ]; then
              SHA1=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass "$KEYSTORE_PASSWORD" -alias iteam | grep 'SHA1:' | awk '{print $2}')
              echo "::notice title=SHA-1 for Google sign-in::$SHA1"
            fi
          fi
          [ -n "$CK_API_TOKEN" ] || echo "::warning::CK_API_TOKEN secret missing — the app will open but can't connect."
          export VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          gradle -p android assembleRelease --no-daemon
          mkdir -p out && cp android/app/build/outputs/apk/release/*.apk "out/iTeam${ITEAM_RELAY:+-Next}-${GITHUB_RUN_NUMBER}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: iTeam-android-apk
          path: out/*.apk
          retention-days: 30
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/iteam.jks"
