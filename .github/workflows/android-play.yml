name: Android Play bundle
# Builds the signed Android App Bundle (.aab) to upload in Google Play Console.
# Download it from the run's "Artifacts" section → Play Console → Testing → Closed testing → Create release → upload.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version shown on Google Play"
        default: "1.0.0"

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Upload key
        # The same key as the sideload APK, used as the Play *upload* key (Google holds the app signing key).
        env:
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          [ -n "$PW" ] && [ -f android/signing/iteam.jks.enc ] || { echo "::error::Run the Android APK workflow once with ANDROID_KEYSTORE_PASSWORD set first."; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -pass env:PW -in android/signing/iteam.jks.enc -out "$RUNNER_TEMP/iteam.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/iteam.jks" >> "$GITHUB_ENV"
      - name: Build bundle
        env:
          CK_API_TOKEN: ${{ secrets.CK_API_TOKEN }}
          CK_ENV: ${{ vars.CK_ENV || 'production' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          [ -n "$CK_API_TOKEN" ] || { echo "::error::CK_API_TOKEN secret missing"; exit 1; }
          export VERSION_CODE=$(( ($(date +%s) - 1735689600) / 60 ))
          gradle -p android bundleRelease --no-daemon
          mkdir -p out && cp android/app/build/outputs/bundle/release/*.aab "out/iTeam-${VERSION_NAME}-${VERSION_CODE}.aab"
          echo "::notice title=bundle::iTeam ${VERSION_NAME} (version code ${VERSION_CODE}) — download the artifact and upload it in Play Console"
      - uses: actions/upload-artifact@v4
        with:
          name: iTeam-play-bundle
          path: out/*.aab
          retention-days: 30
      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/iteam.jks"
