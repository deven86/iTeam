name: TestFlight

# Manual only — nothing is ever uploaded without you pressing "Run workflow".
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type UPLOAD to send this build to TestFlight'
        required: true
      cloud_env:
        description: 'iCloud environment: Production (normal) or Development (one-time build that creates push subscriptions)'
        required: false
        default: 'Production'

jobs:
  upload:
    if: ${{ github.event.inputs.confirm == 'UPLOAD' }}
    runs-on: macos-15-intel
    timeout-minutes: 60
    environment: release        # add required reviewers to this environment in GitHub for a second approval
    permissions:
      contents: read
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode 26 (Apple requires the iOS 26 SDK)
        run: |
          echo "::notice title=xcodes::$(ls -d /Applications/Xcode*.app | xargs -n1 basename | tr '\n' ' ')"
          X=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$X" ]; then echo "::error title=xcode::No Xcode 26 installed on this runner image"; exit 1; fi
          sudo xcode-select -s "$X/Contents/Developer"
          echo "::notice title=selected::$(xcodebuild -version | tr '\n' ' ')"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Write App Store Connect API key (temporary, runner only)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8_BASE64 }}" > "$RUNNER_TEMP/keys/raw"
          if grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/raw"; then cp "$RUNNER_TEMP/keys/raw" "$RUNNER_TEMP/keys/AuthKey.p8"; else tr -d ' \r\n' < "$RUNNER_TEMP/keys/raw" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey.p8"; fi
          rm -f "$RUNNER_TEMP/keys/raw"
          for s in TEAM_ID ASC_KEY_ID ASC_ISSUER_ID; do [ -n "${!s}" ] || echo "::error title=secret::Repository secret for $s is empty (APPLE_TEAM_ID / ASC_KEY_ID / ASC_ISSUER_ID)"; done
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey.p8" || { echo "::error title=secret::ASC_KEY_P8_BASE64 is empty or not a valid .p8 key"; exit 1; }

      - name: Install signing (read-only)
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey.p8" >> "$GITHUB_ENV"
          PW="${{ secrets.MATCH_PASSWORD }}"
          [ -n "$PW" ] || { echo "::error title=secret::Add the MATCH_PASSWORD secret (same value in every app repo)"; exit 1; }
          [ -n "${{ secrets.MATCH_GIT_TOKEN }}" ] || { echo "::error title=secret::Add the MATCH_GIT_TOKEN secret (GitHub token for deven86/apple-signing)"; exit 1; }
          echo "::add-mask::$PW"
          AUTH=$(printf 'x-access-token:%s' "${{ secrets.MATCH_GIT_TOKEN }}" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          export ASC_KEY_PATH="$RUNNER_TEMP/keys/AuthKey.p8" MATCH_PASSWORD="$PW" MATCH_GIT_AUTH="$AUTH" APP_IDS=com.jondhale.iteam,com.jondhale.iteam.notify,com.jondhale.iteam.widgets
          set +e
          fastlane signing_install > "$RUNNER_TEMP/match.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/match.log"
          if [ $status -ne 0 ]; then
            grep -iE "error|fail|not found|invalid|\[!\]|run .*signing" "$RUNNER_TEMP/match.log" | tail -8 | cut -c1-900 \
              | while IFS= read -r line; do echo "::error title=signing::$line"; done
            exit $status
          fi

      - name: Archive (signed with distribution cert from match)
        run: |
          set +e
          xcodebuild archive \
            -project iTeam.xcodeproj \
            -scheme iTeam \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/iTeam.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" > "$RUNNER_TEMP/archive.log" 2>&1
          status=$?
          set -e
          tail -40 "$RUNNER_TEMP/archive.log"
          if [ $status -ne 0 ]; then
            grep -E "error:|error -|: error|requires a provisioning profile|No profiles|No Account|No signing certificate|maximum number|Provisioning profile" "$RUNNER_TEMP/archive.log" \
              | sort -u | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=archive::$line"; done
            exit $status
          fi

      - name: Export and upload to App Store Connect
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          if [ "${{ github.event.inputs.cloud_env }}" = "Development" ]; then
            # Export the .ipa locally; the next step re-signs it for the Development iCloud environment and uploads it.
            /usr/libexec/PlistBuddy -c "Set :destination export" "$RUNNER_TEMP/ExportOptions.plist"
          fi
          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/iTeam.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" > "$RUNNER_TEMP/export.log" 2>&1
          status=$?
          set -e
          tail -60 "$RUNNER_TEMP/export.log"
          if [ $status -ne 0 ]; then
            # Surface the real reason as annotations (readable without opening the raw log)
            grep -iE "error|fail|requires|profile|certificate|denied|not (found|allowed)|invalid" "$RUNNER_TEMP/export.log" \
              | grep -v "^\s*$" | tail -8 | cut -c1-900 | while IFS= read -r line; do echo "::error title=export::$line"; done
            DIST=$(grep -oE "/[^ ]*\.xcdistributionlogs" "$RUNNER_TEMP/export.log" | head -1)
            if [ -n "$DIST" ] && [ -d "$DIST" ]; then
              grep -rhiE "error|fail|denied|invalid|requires" "$DIST" 2>/dev/null | grep -viE "^\s*$" \
                | tail -10 | cut -c1-900 | while IFS= read -r line; do echo "::error title=distribution::$line"; done
            fi
            exit $status
          fi

      - name: Development iCloud build — re-sign and upload
        if: ${{ github.event.inputs.cloud_env == 'Development' }}
        run: |
          set -e
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          W="$RUNNER_TEMP/resign"; rm -rf "$W"; mkdir -p "$W"; cd "$W"
          unzip -q "$IPA"
          APP=$(ls -d Payload/*.app | head -1)
          ID=$(security find-identity -v -p codesigning | grep -E "Apple Distribution|iPhone Distribution" | head -1 | awk '{print $2}')
          [ -n "$ID" ] || { echo "::error title=resign::No distribution identity in the keychain"; exit 1; }
          for T in "$APP"/PlugIns/*.appex "$APP"; do
            [ -e "$T" ] || continue
            codesign -d --entitlements :- "$T" > ent.plist 2>/dev/null || true
            if /usr/libexec/PlistBuddy -c "Print :com.apple.developer.icloud-container-environment" ent.plist >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :com.apple.developer.icloud-container-environment Development" ent.plist
            fi
            codesign -f -s "$ID" --entitlements ent.plist --generate-entitlement-der "$T"
          done
          codesign -d --entitlements :- "$APP" 2>/dev/null | grep -A1 icloud-container-environment | tr -d '\t\n' | sed 's/^/::notice title=entitlement::/'; echo
          zip -qry "$RUNNER_TEMP/iTeam-dev.ipa" Payload
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$RUNNER_TEMP/keys/AuthKey.p8" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          set +e
          xcrun altool --upload-app -f "$RUNNER_TEMP/iTeam-dev.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" > "$RUNNER_TEMP/altool.log" 2>&1
          status=$?
          set -e
          tail -30 "$RUNNER_TEMP/altool.log"
          if [ $status -ne 0 ]; then
            grep -iE "error|invalid|fail" "$RUNNER_TEMP/altool.log" | tail -8 | cut -c1-900 | while IFS= read -r l; do echo "::error title=upload::$l"; done
            exit $status
          fi
          rm -rf ~/.appstoreconnect/private_keys

      - name: Remove key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
